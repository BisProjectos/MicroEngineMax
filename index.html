<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer; /* Shows user they can click */
  }
  #logo {
    opacity: 0; /* Starts hidden */
    max-width: 60vmin;
    max-height: 60vmin;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  /* Appear instantly */
  #logo.show {
    opacity: 1;
  }
  /* Fade out smoothly over 3 seconds (from 3.2s to 6.2s) */
  #logo.fade-out {
    opacity: 0;
    transition: opacity 3s ease-in-out;
  }
  
  #error-msg {
    color: #ff4444;
    font-family: monospace;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.5s;
    cursor: default;
  }
</style>
</head>
<body>
  <img id="logo" src="assets/logo.png" alt="Logo">
  <div id="error-msg">Error: engine/menu.html not found!</div>

<script>
  let timeouts = [];
  let audio;
  let hasSkipped = false;

  // Helper to track timeouts so we can cancel them on skip
  function scheduleTimeout(fn, ms) {
    const id = setTimeout(fn, ms);
    timeouts.push(id);
    return id;
  }

  function clearAllTimeouts() {
    timeouts.forEach(clearTimeout);
    timeouts = [];
  }

  function redirectToMenu() {
    if (hasSkipped) return; // Prevent multiple redirects
    hasSkipped = true;

    fetch('engine/menu.html', { method: 'HEAD' })
      .then(response => {
        if (response.ok) {
          window.location.href = 'engine/menu.html';
        } else {
          throw new Error('File not found');
        }
      })
      .catch(error => {
        console.error('Redirect failed:', error);
        // Show error on screen instead of ugly Vercel 404 page
        document.getElementById('error-msg').style.opacity = '1';
        hasSkipped = false; // Allow trying again if it failed
      });
  }

  function triggerSkip() {
    if (hasSkipped) return;
    
    clearAllTimeouts();
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
    }
    redirectToMenu();
  }

  // --- 1. Timeline Logic ---
  
  // T = 1.2s (1s + 0.2s delay): Show logo instantly and play sound
  scheduleTimeout(() => {
    const logo = document.getElementById('logo');
    logo.classList.add('show');

    audio = new Audio('assets/sounds/logo.mp3');
    audio.volume = 0.8;
    const p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => { /* Autoplay may be blocked by browser */ });
    }
  }, 1200); 

  // T = 3.2s (2s after logo appears): Start fading out
  scheduleTimeout(() => {
    document.getElementById('logo').classList.add('fade-out');
  }, 3200); 

  // T = 6.2s (5s total time after logo appears): Redirect
  scheduleTimeout(redirectToMenu, 6200);


  // --- 2. Skip Logic ---

  // Skip on double click
  let clickCount = 0;
  document.body.addEventListener('click', () => {
    clickCount++;
    if (clickCount === 1) {
      // Reset click count if second click doesn't happen fast enough
      setTimeout(() => { clickCount = 0; }, 400);
    } else if (clickCount === 2) {
      triggerSkip();
      clickCount = 0;
    }
  });

  // Skip on Spacebar
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault(); // Prevent page scrolling down
      triggerSkip();
    }
  });
</script>
</body>
</html>
