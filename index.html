<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #logo {
    opacity: 0;
    transform: scale(0.92);
    max-width: 60vmin;
    max-height: 60vmin;
    transition: opacity 1.2s cubic-bezier(.2,.7,.2,1),
                transform 1.2s cubic-bezier(.2,.7,.2,1);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
  }
  #logo.show {
    opacity: 1;
    transform: scale(1);
  }
  /* Error message styling (hidden by default) */
  #error-msg {
    color: #ff4444;
    font-family: monospace;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.0s;
  }
</style>
</head>
<body>
  <img id="logo" src="assets/logo.png" alt="Logo">
  <div id="error-msg">Error: engine/menu.html not found!</div>

<script>
  // 1. Fade in the logo and play sound after 1 second
  setTimeout(() => {
    const logo = document.getElementById('logo');
    logo.classList.add('show');

    // Play accompanying sound
    const tryFormats = ['assets/logo.mp3', 'assets/sounds.ogg', 'assets/sounds.wav'];
    let audio;
    for (const fmt of tryFormats) {
      audio = new Audio(fmt);
      audio.volume = 0.8;
      const p = audio.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => { /* Autoplay blocked or file missing */ });
      }
      break;
    }
  }, 1000);

  // 2. Check if menu.html exists, then redirect after 3 seconds
  setTimeout(() => {
    fetch('engine/menu.html', { method: 'HEAD' })
      .then(response => {
        if (response.ok) {
          // File exists, proceed with redirect
          window.location.href = 'engine/menu.html';
        } else {
          // File returned an error (like 404)
          throw new Error('File not found');
        }
      })
      .catch(error => {
        console.error('Redirect failed:', error);
        // Show the error message on screen instead of a blank Vercel 404 page
        document.getElementById('error-msg').style.opacity = '1';
      });
  }, 3000);
</script>
</body>
</html>
