<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #logo {
    opacity: 0; /* Starts hidden */
    max-width: 60vmin;
    max-height: 60vmin;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  /* No transition rules = instant appearance (no fade) */
  
  #error-msg {
    color: #ff4444;
    font-family: monospace;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
  <img id="logo" src="assets/logo.png" alt="Logo">
  <div id="error-msg">Error: engine/menu.html not found!</div>

<script>
  // 1. Show logo instantly and play sound after 1.2 seconds (1s + 0.2s delay)
  setTimeout(() => {
    const logo = document.getElementById('logo');
    logo.style.opacity = '1'; // Instantly appears, no fade

    // Play the specific sound file
    const audio = new Audio('assets/sounds/logo.mp3');
    audio.volume = 0.8;
    const p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => { /* Autoplay may be blocked by browser until user clicks */ });
    }
  }, 1200); 

  // 2. Check if menu.html exists, then redirect after 3.2 seconds (3s + 0.2s delay)
  setTimeout(() => {
    fetch('engine/menu.html', { method: 'HEAD' })
      .then(response => {
        if (response.ok) {
          // File exists, proceed with redirect
          window.location.href = 'engine/menu.html';
        } else {
          // File returned an error (like 404)
          throw new Error('File not found');
        }
      })
      .catch(error => {
        console.error('Redirect failed:', error);
        // Show the error message on screen instead of a blank Vercel 404 page
        document.getElementById('error-msg').style.opacity = '1';
      });
  }, 3200); 
</script>
</body>
</html>
